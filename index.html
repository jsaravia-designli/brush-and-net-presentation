<p class="slide-cover-sub">Let’s lock in the path forward.</p>
<div class="slide-cover-footer">designli.co</div>
</div></div>
</section>

</template>
<template id="ui-src" data-src="">
<div class="present-ui" id="ui">
<div class="present-counter"><span id="curr">1</span><span class="sep">/</span><span id="total">1</span></div>
<button class="present-hint present-edit" id="edit" aria-label="Edit text" aria-pressed="false" hidden="">✎</button>
<button class="present-hint present-nav-prev" id="prev" aria-label="Previous slide">‹</button>
<button class="present-hint present-nav-next" id="next" aria-label="Next slide">›</button>
<button class="present-hint" id="hint" aria-label="Keyboard shortcuts">?</button>
</div>
<div class="edit-bar" id="edit-bar" hidden="">
<span class="edit-hint"><strong>Editing</strong> · click any outlined text to change it</span>
<span class="edit-status" id="edit-status"></span>
<button type="button" class="edit-cancel" id="edit-cancel">Discard</button>
<button type="button" class="edit-save" id="edit-save">Save</button>
</div>
<div class="present-help" id="help" hidden="">
<div class="present-help-inner">
<h2>Keyboard</h2>
<dl>
<dt>→ · Space · PageDown</dt><dd>Next slide</dd>
<dt>← · Shift+Space · PageUp</dt><dd>Previous slide</dd>
<dt>Home · End</dt><dd>First · Last</dd>
<dt>F</dt><dd>Fullscreen</dd>
<dt>E</dt><dd>Edit text (owners and editors)</dd>
<dt>Esc</dt><dd>Close overlay / exit fullscreen</dd>
</dl>
<p class="present-help-close">Press <kbd>?</kbd> to dismiss</p>
</div>
</div>
</template>
<script data-src="">
(function () {
  const src = document.getElementById('deck-src');
  const stage = document.getElementById('stage');
  stage.appendChild(src.content.cloneNode(true));
  document.getElementById('ui-root').appendChild(document.getElementById('ui-src').content.cloneNode(true));

  const slides = [...stage.querySelectorAll('.present-slide-wrap')];
  const curr = document.getElementById('curr');
  const help = document.getElementById('help');
  document.body.classList.add('present-body');
  document.getElementById('total').textContent = slides.length;
  let i = 0;
  let editing = false;

  function go(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle('is-active', k === i));
    curr.textContent = i + 1;
    try { history.replaceState(null, '', '#s' + (i + 1)); } catch (e) {}
  }
  let start = 0;
  const m = /^#s(\d+)$/.exec(location.hash);
  if (m) start = +m[1] - 1;
  try { const s = sessionStorage.getItem('deck-slide'); if (s !== null) { start = +s; sessionStorage.removeItem('deck-slide'); } } catch (e) {}
  go(start);

  document.getElementById('prev').onclick = () => go(i - 1);
  document.getElementById('next').onclick = () => go(i + 1);
  document.getElementById('hint').onclick = () => { help.hidden = !help.hidden; };
  help.onclick = () => { help.hidden = true; };

  document.addEventListener('keydown', (e) => {
    if (e.target.isContentEditable) {
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    if (e.target.closest('input, textarea, [role="switch"]') && (e.key === ' ' || e.key === 'Enter')) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && !e.shiftKey)) { e.preventDefault(); go(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || (k === ' ' && e.shiftKey)) { e.preventDefault(); go(i - 1); }
    else if (k === 'Home') go(0);
    else if (k === 'End') go(slides.length - 1);
    else if (k === '?') help.hidden = !help.hidden;
    else if (k === 'Escape') help.hidden = true;
    else if ((k === 'e' || k === 'E') && !document.getElementById('edit').hidden) { editing ? null : enterEdit(); }
    else if (k === 'f' || k === 'F') {
      const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
      p?.catch?.(() => {});
    }
  });

  let x0 = null;
  stage.addEventListener('touchstart', (e) => { x0 = editing ? null : e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) go(i + (dx < 0 ? 1 : -1));
  });

  let idle;
  document.addEventListener('mousemove', () => {
    document.body.classList.remove('is-idle');
    clearTimeout(idle);
    if (!editing) idle = setTimeout(() => document.body.classList.add('is-idle'), 2500);
  });

  // Team builder: cost = rate × allocation × qty; yearly toggle swaps to the yearly rate.
  const tb = stage.querySelector('.iw-team-builder');
  if (tb) {
    const rows = [...tb.querySelectorAll('.tb-row')];
    const toggle = document.getElementById('tb-yearly');
    const fmt = (n) => '$' + Math.round(n).toLocaleString('en-US');
    const cost = (r, yearly) => (yearly ? +r.dataset.rateYearly : +r.dataset.rate) * (+r.dataset.alloc / 100) * (+r.dataset.qty || 1);

    function render() {
      const yearly = toggle.classList.contains('is-on');
      let mtm = 0, yr = 0;
      rows.forEach((r) => {
        r.querySelectorAll('.tb-alloc button').forEach((b) => b.classList.toggle('is-active', b.dataset.pct === r.dataset.alloc));
        r.querySelector('.tb-cost').textContent = fmt(cost(r, yearly));
        if (r.classList.contains('is-on')) { mtm += cost(r, false); yr += cost(r, true); }
      });
      document.getElementById('tb-total-num').innerHTML = fmt(yearly ? yr : mtm) + ' <span>/ month</span>';
      document.getElementById('tb-total-save').innerHTML = yearly
        ? 'Yearly commitment - <strong>' + fmt(mtm - yr) + ' / month less</strong> than month-to-month (' + fmt(mtm) + ').'
        : 'Month-to-month - or <strong>' + fmt(yr) + ' / month on yearly</strong>. Switch any time in the first 90 days, credited back to Day 1.';
    }

    rows.forEach((r) => {
      r.addEventListener('click', (e) => {
        if (editing) return;
        const b = e.target.closest('.tb-alloc button');
        if (b) { r.dataset.alloc = b.dataset.pct; r.classList.add('is-on'); }
        else {
          r.classList.toggle('is-on');
          const lead = tb.querySelector('[data-id="lead"]');
          if (r.classList.contains('is-on') && r.dataset.needs === 'lead') lead.classList.add('is-on');
          if (r === lead && !lead.classList.contains('is-on')) tb.querySelectorAll('[data-needs="lead"]').forEach((g) => g.classList.remove('is-on'));
        }
        render();
      });
    });
    const flip = () => { toggle.classList.toggle('is-on'); toggle.setAttribute('aria-checked', toggle.classList.contains('is-on')); render(); };
    toggle.addEventListener('click', flip);
    toggle.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    render();
  }

  // ---- Click-to-edit ----
  // Text blocks that can be edited. Matches nested inside another match are skipped,
  // so the n-th block on stage always lines up with the n-th block in the source template.
  const EDITABLE = [
    'h2', 'h3', 'p', 'li',
    '.slide-cover-client-project', '.slide-cover-footer', '.slide-eyebrow', '.tl-eyebrow',
    '.iwf-issues-pri', '.iwf-issues-name', '.iwf-issues-area', '.iwf-issue-tag', '.iwf-issue-why-label',
    '.iwf-unblock-step', '.iwf-hdd-cap', '.iwf-frame-vision .tag', '.iwf-frame-vision .big', '.iwf-frame-break',
    '.iwf-frame-step .lbl', '.iwf-frame-step .sub', '.iwf-d30o-outcome-label', '.iwf-d30o-outcome', '.iwf-d30o-guarantee',
    '.iwf-d30p-outcome', '.iwf-d30p-text', '.iwf-ladder-first', '.iwf-prop-btn', '.iwf-prop-url',
    '.iwf-tie-when', '.iwf-tie-what', '.iwf-qa-big', '.iwf-qa-team', '.iwf-qa-names',
    '.rr2-day .d', '.rr2-day .l', '.rr2-body .h', '.rr2-body .s', '.rr2-body .rc', '.rr2-stamp > div', '.rr2-caption',
    '.tb-who .role', '.tb-who .desc', '.tb-toggle .lbl', '.slide-menu-code', '.slide-menu-name'
  ].join(',');
  const blocks = (root) => [...root.querySelectorAll(EDITABLE)].filter((el) => !el.parentElement.closest(EDITABLE));

  const editBtn = document.getElementById('edit');
  const bar = document.getElementById('edit-bar');
  const status = document.getElementById('edit-status');
  const saveBtn = document.getElementById('edit-save');
  let live = [];
  let before = [];
  let artifact = null;

  function setEditing(on) {
    editing = on;
    document.body.classList.toggle('is-editing', on);
    document.body.classList.remove('is-idle');
    editBtn.setAttribute('aria-pressed', on);
    bar.hidden = !on;
    status.textContent = '';
    live.forEach((el) => {
      if (on) { el.setAttribute('contenteditable', 'true'); el.setAttribute('data-editable', ''); el.spellcheck = true; }
      else { el.removeAttribute('contenteditable'); el.removeAttribute('data-editable'); el.removeAttribute('spellcheck'); }
    });
  }
  function enterEdit() {
    live = blocks(stage);
    before = live.map((el) => el.innerHTML);
    setEditing(true);
  }
  function discard() {
    live.forEach((el, k) => { el.innerHTML = before[k]; });
    setEditing(false);
  }

  stage.addEventListener('paste', (e) => {
    if (!e.target.closest('[contenteditable="true"]')) return;
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });
  stage.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.isContentEditable) { e.preventDefault(); document.execCommand('insertLineBreak'); }
  });

  // Rebuild the full document from the page's own source pieces (never the live DOM).
  const SKELETON = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
  function buildDocument() {
    const parts = [...document.querySelectorAll('[data-src]')].map((el) =>
      el.dataset.src === 'mount' ? el.cloneNode(false).outerHTML : el.outerHTML);
    return SKELETON + '\n' + parts.join('\n') + '\n</body></html>';
  }

  async function save() {
    const srcBlocks = blocks(src.content);
    let changed = 0;
    live.forEach((el, k) => {
      const html = el.innerHTML.replace(/ $/, ' ').trim();
      if (el.innerHTML !== before[k] && srcBlocks[k]) { srcBlocks[k].innerHTML = html; changed++; }
    });
    if (!changed) { setEditing(false); return; }
    saveBtn.disabled = true;
    status.textContent = 'Saving…';
    const html = buildDocument();
    try {
      try { sessionStorage.setItem('deck-slide', String(i)); } catch (e) {}
      try {
        await artifact.publish({ 'index.html': { content: html, contentType: 'text/html' } });
      } catch (err) {
        if (err && (err.code === 'capability_disabled' || err.code === 'capability_removed')) await artifact.publish(html);
        else throw err;
      }
      before = live.map((el) => el.innerHTML);
      setEditing(false);
    } catch (err) {
      const code = err && err.code;
      if (code === 'conflict') status.textContent = 'Someone saved a newer version. Reloading it now.';
      else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'not_declared') {
        status.textContent = 'This view is read-only. Ask the owner for edit access.';
        editBtn.hidden = true;
      } else if (code === 'rate_limited') status.textContent = 'Saving too often. Wait a moment, then press Save again.';
      else status.textContent = 'Couldn’t save. Press Save to try again.';
    } finally {
      saveBtn.disabled = false;
    }
  }

  editBtn.onclick = () => (editing ? discard() : enterEdit());
  document.getElementById('edit-cancel').onclick = discard;
  saveBtn.onclick = save;

  (async () => {
    if (!window.claude || !window.claude.use) return;
    artifact = await window.claude.use('artifact');
    if (artifact) editBtn.hidden = false;
  })();
})();
</script>
</body></html>
